[package]
name = "revera"
version = "0.1.0"
edition = "2021"
description = "Provider-independent PR reviewer with Vera retrieval"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
globset = "0.4"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
