[package]
name = "revera"
version = "0.5.0"
edition = "2024"
description = "Provider-agnostic AI code review for GitHub pull requests, with independent validation and optional repository-aware retrieval."
license = "MIT"
repository = "https://github.com/VeraTools/revera"
readme = "README.md"
keywords = ["code-review", "github-actions", "llm", "pull-requests"]
categories = ["development-tools"]
rust-version = "1.89"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "net", "io-util", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
hex = "0.4"
webpki-root-certs = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
url = "2"
axum = "0.8.9"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
nix = { version = "0.31", features = ["signal", "process"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
mime_guess = "2.0.5"
getrandom = "0.4.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
aws-lc-rs = "1.18.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
