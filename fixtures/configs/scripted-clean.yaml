review:
  strategy: baseline
  publish: dry-run
models:
  investigator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/clean.json
    model: scripted-investigator
  validator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/clean.json
    model: scripted-validator
vera:
  executable: vera
  version: "1.4.1"
  backend: api
  embedding:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-embedding-8b
    api_key_env: OPENROUTER_API_KEY
