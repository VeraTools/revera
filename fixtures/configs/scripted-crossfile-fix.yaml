review:
  strategy: baseline
  publish: dry-run
models:
  investigator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/crossfile-fix.json
    model: scripted-investigator
  validator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/crossfile-fix.json
    model: scripted-validator
vera:
  executable: vera
  version: "1.4.1"
  backend: api
  embedding:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-embedding-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
