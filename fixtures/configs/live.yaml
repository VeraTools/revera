review:
  strategy: baseline
  publish: dry-run
models:
  investigator:
    protocol: openai-responses
    base_url: ${REVERA_INVESTIGATOR_BASE_URL}
    api_key_env: REVERA_INVESTIGATOR_API_KEY
    model: muse-spark-1.3-contributor
    max_output_tokens: 6000
    temperature: 0.2
    reasoning: medium
  validator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3-flash
    max_output_tokens: 4000
    temperature: 0.2
    reasoning: high
vera:
  executable: vera
  version: "1.4.1"
  backend: api
  embedding:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-embedding-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
  reranker:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-reranker-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
