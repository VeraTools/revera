# Offline config for the composite-Action smoke: scripted models, no Vera,
# no provider credentials. The investigator submits a valid empty list, so
# the run must be reported as `complete`. The smoke reviews the PR's own
# diff, so the diff cap is raised to keep large PRs from turning it partial.
review:
  strategy: baseline
  publish: dry-run
  max_diff_bytes: 5000000
models:
  investigator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/clean.json
    model: scripted-investigator
  validator:
    protocol: scripted
    script: ${FIXTURE_SCRIPTS}/clean.json
    model: scripted-validator
vera:
  enabled: false
github:
  summary_marker: "<!-- revera-smoke-summary -->"
