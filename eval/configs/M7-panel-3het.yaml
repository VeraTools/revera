review:
  strategy: panel
  publish: dry-run
  min_severity: low
  concurrency: 3
budget:
  run_max_seconds: 600
  agent_max_seconds: 300
  agent_max_tool_calls: 30
  run_max_requests: 120
panel:
  focuses:
    - general
    - cross-file
    - data
  scout_max_tool_calls: 30
models:
  investigator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3
    max_output_tokens: 6000
    temperature: 0.2
    reasoning: max
  validator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3-flash
    max_output_tokens: 4000
    temperature: 0.2
    reasoning: high
  scouts:
    - name: glm
      protocol: openai-chat
      base_url: ${REVERA_MODEL_BASE_URL}
      api_key_env: REVERA_MODEL_API_KEY
      model: glm-5.3
      max_output_tokens: 6000
      temperature: 0.2
      reasoning: max
    - name: gemini
      protocol: openai-chat
      base_url: ${REVERA_MODEL_BASE_URL}
      api_key_env: REVERA_MODEL_API_KEY
      model: gemini-3.8-flash
      max_output_tokens: 6000
      temperature: 0.2
      reasoning: high
    - name: deepseek
      protocol: openai-chat
      base_url: ${REVERA_MODEL_BASE_URL}
      api_key_env: REVERA_MODEL_API_KEY
      model: deepseek-v4.1-flash
      max_output_tokens: 6000
      temperature: 0.2
      reasoning: high
vera:
  executable: vera
  version: "1.4.1"
  backend: api
  embedding:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-embedding-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
  reranker:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-reranker-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
