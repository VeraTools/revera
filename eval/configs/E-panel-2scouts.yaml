review:
  strategy: panel
  publish: dry-run
  min_severity: low
  concurrency: 2
models:
  investigator:
    protocol: openai-chat
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    api_key_env: REVERA_EMBEDDING_API_KEY
    model: meta/muse-spark-1.3-contributor
    max_output_tokens: 4000
    temperature: 0.2
    extra_headers:
      HTTP-Referer: https://github.com/VeraTools/revera
      X-Title: Revera
  validator:
    protocol: openai-chat
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    api_key_env: REVERA_EMBEDDING_API_KEY
    model: meta/muse-spark-1.3-contributor
    max_output_tokens: 3000
    temperature: 0.2
    extra_headers:
      HTTP-Referer: https://github.com/VeraTools/revera
      X-Title: Revera
vera:
  executable: vera
  version: "1.4.1"
  backend: api
  embedding:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-embedding-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
  reranker:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-reranker-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
