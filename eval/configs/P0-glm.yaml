# Held-out real-bug set, original main (origin/main) with the PR-intent eval input.
# Investigator factory/glm-5.3 through an OpenAI-Responses endpoint
# (REVERA_MODEL_BASE_URL, REVERA_MODEL_API_KEY); Vera off
# (no embedding endpoint). Validator: GLM glm-5.3-flash, as in the M* screening.
review:
  strategy: baseline
  publish: dry-run
  min_severity: low
budget:
  run_max_seconds: 600
  agent_max_seconds: 300
  agent_max_tool_calls: 30
  run_max_requests: 120
models:
  investigator:
    protocol: openai-responses
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: factory/glm-5.3
    max_output_tokens: 16000
    temperature: 0.2
    reasoning: high
  validator:
    protocol: openai-responses
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: factory/glm-5.3-flash
    max_output_tokens: 8000
    temperature: 0.2
    reasoning: high
vera:
  enabled: false
  executable: vera
