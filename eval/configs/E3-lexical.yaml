review:
  strategy: baseline
  publish: dry-run
  min_severity: low
budget:
  run_max_seconds: 600
  agent_max_seconds: 300
  agent_max_tool_calls: 30
  run_max_requests: 120
models:
  investigator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3
    max_output_tokens: 6000
    temperature: 0.2
    reasoning: max
  validator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3-flash
    max_output_tokens: 4000
    temperature: 0.2
    reasoning: high
vera:
  enabled: false
