name: Revera
# Consumers must check out pull_request.head.sha so reviewer tools read the PR head tree.
description: Provider-agnostic AI code review for GitHub pull requests, with independent validation and optional repository-aware retrieval.
branding:
  icon: search
  color: purple
inputs:
  config:
    description: Path to revera config file
    default: revera.yaml
  profile:
    description: Config profile to apply
    default: ""
  strategy:
    description: Review strategy override
    default: ""
  publish:
    description: "Publication mode: dry-run | comment"
    default: comment
  fail-on:
    description: "Fail the step on: failed | partial | never"
    default: failed
  revera-version:
    description: Revera release version to install
    default: "0.4.4"
  vera-version:
    description: Vera release version to install
    default: "2.0.1"
  github-token:
    description: Token used to read PR data and post comments
    default: ${{ github.token }}
  cache:
    description: Cache the .vera index between runs
    default: "true"
outputs:
  status:
    description: Review status (complete | partial | failed)
    value: ${{ steps.outcome.outputs.status }}
  report-path:
    description: Path to the JSON run report (empty when the run failed before writing one)
    value: ${{ steps.outcome.outputs.report-path }}
  findings:
    description: Number of accepted findings (0 when no trustworthy report exists)
    value: ${{ steps.outcome.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Runner check
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "revera action supports Linux x86_64 runners only" >&2
          exit 1
        fi

    - name: Install revera
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REVERA_VERSION: ${{ inputs.revera-version }}
      # GITHUB_PATH gets a fixed runner-owned directory, never user input.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        "$ACTION_PATH/scripts/install-revera.sh" "$REVERA_VERSION" "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # Cache identity covers only what shapes the index (vera version, backend,
    # embedding model, excludes) — not the reranker, investigator/validator,
    # prompts, budgets or credentials — so those changes keep a warm index.
    - name: Vera cache key
      id: key
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        # same trusted base-revision config the review step loads
        args=(cache-key --event "$GITHUB_EVENT_PATH" --config "$CONFIG")
        if [ -n "$PROFILE" ]; then args+=(--profile "$PROFILE"); fi
        if key=$(revera "${args[@]}" 2>/dev/null); then
          echo "value=$key" >> "$GITHUB_OUTPUT"
        else
          # older revera without `cache-key`: fall back to hashing the config
          echo "value=cfg-${{ hashFiles(inputs.config) }}" >> "$GITHUB_OUTPUT"
        fi

    # `vera.enabled: false` (key = disabled) runs lexical-only and must not
    # depend on a Vera release download.
    - name: Install vera
      if: steps.key.outputs.value != 'disabled'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERA_VERSION: ${{ inputs.vera-version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        "$ACTION_PATH/scripts/install-vera.sh" "$VERA_VERSION" "$RUNNER_TEMP/bin"

    - name: Restore .vera index cache
      if: inputs.cache == 'true' && steps.key.outputs.value != 'disabled'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .vera
          .revera/vera-cache.json
        key: revera-vera-${{ runner.os }}-${{ inputs.vera-version }}-${{ steps.key.outputs.value }}-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          revera-vera-${{ runner.os }}-${{ inputs.vera-version }}-${{ steps.key.outputs.value }}-${{ github.event.pull_request.base.ref }}-
          revera-vera-${{ runner.os }}-${{ inputs.vera-version }}-${{ steps.key.outputs.value }}-

    - name: Run revera
      id: revera
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CONFIG: ${{ inputs.config }}
        PROFILE: ${{ inputs.profile }}
        STRATEGY: ${{ inputs.strategy }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        rm -f .revera/report.json
        before=$(cat .revera/vera-cache.json 2>/dev/null || true)
        args=(review --event "$GITHUB_EVENT_PATH" --config "$CONFIG" --publish "$PUBLISH" --out .revera/report.json)
        if [ -n "$PROFILE" ]; then args+=(--profile "$PROFILE"); fi
        if [ -n "$STRATEGY" ]; then args+=(--strategy "$STRATEGY"); fi
        set +e
        revera "${args[@]}"
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # the cache info is rewritten only after a successful index/update
        after=$(cat .revera/vera-cache.json 2>/dev/null || true)
        if [ -n "$after" ] && [ "$after" != "$before" ]; then
          echo "index-ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "index-ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Review outcome
      id: outcome
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CODE: ${{ steps.revera.outputs.code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        "$ACTION_PATH/scripts/action-outcome.sh" "$CODE" .revera/report.json "$FAIL_ON"

    # Save only when this run produced a healthy index; a failed index or a
    # run that never reached Vera must not overwrite/poison the cache.
    - name: Save .vera index cache
      if: always() && inputs.cache == 'true' && steps.revera.outputs.index-ok == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .vera
          .revera/vera-cache.json
        key: revera-vera-${{ runner.os }}-${{ inputs.vera-version }}-${{ steps.key.outputs.value }}-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
