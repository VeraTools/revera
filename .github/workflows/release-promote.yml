name: release-promote

# Deliberately promote a previously verified stable release. This workflow is
# protected by the release-verify environment's required reviewers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact stable release tag to promote (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    environment: release-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag must be an exact stable vX.Y.Z tag"; exit 1; }

      - name: Verify release tag exists
        run: |
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            if [[ "$out" == *"HTTP 404"* ]]; then
              echo "::error::tag $TAG does not exist"
            else
              echo "::error::cannot verify tag $TAG: $out"
            fi
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Verify published stable release
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "$release_json" >/dev/null \
            || { echo "::error::no published non-prerelease GitHub release exists for $TAG"; exit 1; }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify versioned multi-arch image before promotion
        run: |
          set -euo pipefail
          image="ghcr.io/veratools/revera:${TAG#v}"
          if ! docker buildx imagetools inspect "$image" --raw > "$RUNNER_TEMP/revera-image.json"; then
            echo "::error::versioned image $image does not exist or cannot be inspected"
            exit 1
          fi
          jq -e '
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")
            and any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' "$RUNNER_TEMP/revera-image.json" >/dev/null \
            || { echo "::error::$image must contain both linux/amd64 and linux/arm64"; exit 1; }

      - name: Move major tag and mark release latest
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          target=$(git rev-parse "$TAG^{commit}")
          # Through the API so the checkout never needs persisted git credentials.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$target" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$target" >/dev/null
          fi
          gh release edit "$TAG" --latest

      - name: Verify major tag and latest release
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          expected=$(git rev-parse "$TAG^{commit}")
          actual=$(git ls-remote --refs origin "refs/tags/$major" | awk 'NR == 1 {print $1}')
          [ "$actual" = "$expected" ] \
            || { echo "::error::$major points at ${actual:-missing}, expected $expected"; exit 1; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ "$latest" = "$TAG" ] \
            || { echo "::error::latest release is ${latest:-missing}, expected $TAG"; exit 1; }
          echo "$TAG promoted as $major and latest."

      - name: Promote verified image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/veratools/revera:0 \
            --tag ghcr.io/veratools/revera:latest \
            "ghcr.io/veratools/revera:${TAG#v}"
