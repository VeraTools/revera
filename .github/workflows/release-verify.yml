name: release-verify

# Maintainer-triggered live verification of a *released* Revera against a
# controlled fixture PR (one containing a known defect). Unlike
# dogfood-released.yml it never skips: missing credentials fail the run.
# It validates the released binary + the base-revision config of the fixture
# PR, not the source of the branch it is dispatched from; self-review.yml
# covers new source.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to verify (e.g. v0 or v0.3.0)
        default: v0
        required: true
      pr:
        description: Fixture pull request number (must contain a known defect)
        required: true
      expect_file:
        description: Exact repository-relative path for the known defect
        required: true
      expect_terms:
        description: Required comma-separated term groups; | separates alternatives within a group
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-verify
  cancel-in-progress: false

jobs:
  verify:
    # protect this environment (required reviewers) in repository settings
    environment: release-verify
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release }}
      PR: ${{ inputs.pr }}
      EXPECT_FILE: ${{ inputs.expect_file }}
      EXPECT_TERMS: ${{ inputs.expect_terms }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
      REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
    steps:
      - name: Require live credentials
        run: |
          missing=()
          [ -n "$REVERA_EMBEDDING_API_KEY" ] || missing+=(REVERA_EMBEDDING_API_KEY)
          [ -n "$REVERA_MODEL_API_KEY" ] || missing+=(REVERA_MODEL_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release verification needs ${missing[*]}; this is a failure, not a skip"; exit 1
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
          [[ "$RELEASE" =~ ^(v0|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::release must be v0 or an exact stable vX.Y.Z tag"; exit 1; }
          [ -n "$EXPECT_FILE" ] || { echo "::error::expect_file is required"; exit 1; }
          [ -n "$EXPECT_TERMS" ] || { echo "::error::expect_terms is required"; exit 1; }
          [[ "$EXPECT_FILE" != *$'\n'* ]] || { echo "::error::expect_file must be one path"; exit 1; }
          [[ "$EXPECT_TERMS" != *$'\n'* ]] || { echo "::error::expect_terms must be comma-separated"; exit 1; }
          [[ "$EXPECT_TERMS" != ,* && "$EXPECT_TERMS" != *, && "$EXPECT_TERMS" != *,,* ]] \
            || { echo "::error::expect_terms contains an empty comma-separated group"; exit 1; }

      - name: Fixture PR event
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          jq --slurpfile pr "$RUNNER_TEMP/pr.json" --arg repo "$GITHUB_REPOSITORY" -n \
            '{number: $pr[0].number, pull_request: $pr[0], repository: {full_name: $repo}}' \
            > "$RUNNER_TEMP/event.json"
          echo "HEAD_SHA=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_ENV"
          if [ "$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::fixture PR must come from this repository"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: verifier

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
          path: fixture

      - name: Resolve exact release tag
        run: |
          set -euo pipefail
          if [ "$RELEASE" = v0 ]; then
            git -C fixture ls-remote --tags origin > "$RUNNER_TEMP/release-tags.txt"
            resolved=$(python3 - "$RUNNER_TEMP/release-tags.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          refs = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if len(fields) != 2:
                  continue
              sha, ref = fields
              if ref.endswith("^{}"):
                  refs[ref[:-3]] = sha
              else:
                  refs.setdefault(ref, sha)
          target = refs.get("refs/tags/v0")
          if not target:
              raise SystemExit("::error::v0 tag does not exist")
          candidates = []
          for ref, sha in refs.items():
              match = re.fullmatch(r"refs/tags/v(\d+)\.(\d+)\.(\d+)", ref)
              if match and sha == target:
                  candidates.append((tuple(map(int, match.groups())), ref[10:]))
          if not candidates:
              raise SystemExit("::error::v0 does not point at any exact vX.Y.Z tag")
          print(max(candidates)[1])
          PY
          )
          else
            resolved="$RELEASE"
          fi
          git -C fixture ls-remote --exit-code --tags origin "refs/tags/$resolved" >/dev/null \
            || { echo "::error::resolved release tag $resolved does not exist"; exit 1; }
          echo "RELEASE_REF=$resolved" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
          path: released

      - name: Install released binaries
        run: |
          set -euo pipefail
          sha=$(git -C released rev-parse HEAD)
          version=$(sed -n '/^  revera-version:/,/default:/ s/.*default: *"\([^"]*\)".*/\1/p' released/action.yml | head -n1)
          vera_version=$(sed -n '/^  vera-version:/,/default:/ s/.*default: *"\([^"]*\)".*/\1/p' released/action.yml | head -n1)
          mkdir -p "$RUNNER_TEMP/bin"
          released/scripts/install-revera.sh "$version" "$RUNNER_TEMP/bin"
          released/scripts/install-vera.sh "$vera_version" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          revera_version=$("$RUNNER_TEMP/bin/revera" --version)
          revera_sha=$(sha256sum "$RUNNER_TEMP/bin/revera" | cut -d' ' -f1)
          echo "REVERA_VERSION_OUTPUT=$revera_version" >> "$GITHUB_ENV"
          echo "BINARY_SHA256=$revera_sha" >> "$GITHUB_ENV"
          {
            echo "## Release verification"
            echo "- release: \`$RELEASE_REF\` -> \`$sha\`"
            echo "- revera: \`$revera_version\` sha256 \`$revera_sha\`"
            echo "- vera: \`$vera_version\`"
            echo "- fixture: #$PR base \`$BASE_SHA\`, head \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review twice and record exit codes
        working-directory: fixture
        run: |
          set -euo pipefail
          for run in 1 2; do
            set +e
            revera review --event "$RUNNER_TEMP/event.json" --config .github/revera-self-review.yaml \
              --publish comment --out "$RUNNER_TEMP/report-$run.json"
            code=$?
            set -e
            echo "run $run exit code: $code"
            if [ "$run" = 1 ]; then
              echo "REVIEW_EXIT_1=$code" >> "$GITHUB_ENV"
            else
              echo "REVIEW_EXIT_2=$code" >> "$GITHUB_ENV"
            fi
          done

      - name: Verify release proof
        run: |
          set -euo pipefail
          IFS=',' read -r -a groups <<< "$EXPECT_TERMS"
          term_args=()
          for group in "${groups[@]}"; do
            term_args+=(--expect-term "$group")
          done
          python3 "$GITHUB_WORKSPACE/verifier/scripts/verify-release-report.py" \
            --report1 "$RUNNER_TEMP/report-1.json" \
            --report2 "$RUNNER_TEMP/report-2.json" \
            --exit1 "$REVIEW_EXIT_1" \
            --exit2 "$REVIEW_EXIT_2" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --tag "$RELEASE_REF" \
            --version-output "$REVERA_VERSION_OUTPUT" \
            --binary-sha256 "$BINARY_SHA256" \
            --expect-file "$EXPECT_FILE" \
            "${term_args[@]}" \
            --author github-actions[bot] \
            --out-summary "$RUNNER_TEMP/release-proof.md"
          cat "$RUNNER_TEMP/release-proof.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verify-reports
          path: |
            ${{ runner.temp }}/report-*.json
            ${{ runner.temp }}/release-proof.md
          if-no-files-found: ignore
