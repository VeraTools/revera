name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Offline: everything here runs without provider credentials or network
  # access beyond the toolchain, on every push and on fork PRs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package and Action versions
        run: ./scripts/check-versions.sh
      - name: Public docs hygiene
        run: ./scripts/check-docs-hygiene.sh
      - name: Installer tests (revera, vera)
        run: |
          bash scripts/test-install-revera.sh
          bash scripts/test-install-vera.sh
      - name: Action outcome normalisation test
        run: bash scripts/test-action-outcome.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: doctor fails without publication credentials
        env:
          FIXTURE_SCRIPTS: ${{ github.workspace }}/fixtures/scripts
        run: |
          set -euo pipefail
          cfg=$RUNNER_TEMP/doctor.yaml
          sed 's/publish: dry-run/publish: comment/' fixtures/action/scripted-clean.yaml > "$cfg"
          echo '  token_env: REVERA_CI_MISSING_TOKEN' >> "$cfg"
          if env -u REVERA_CI_MISSING_TOKEN cargo run -q -- doctor --config "$cfg"; then
            echo "doctor must fail when the publish token is missing" >&2; exit 1
          fi
          REVERA_CI_MISSING_TOKEN=placeholder cargo run -q -- doctor --config "$cfg"

  # Live: scripted models but a real Vera index built through OpenRouter
  # embeddings. Shown as *skipped* (not passed) when the secret is absent,
  # e.g. on fork PRs. The offline composite-Action proof is action-smoke.yml.
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live fixtures skipped::OPENROUTER_API_KEY is not available to this run (expected for fork PRs); the live-fixtures job is skipped, not passed."
          fi

  live-fixtures:
    needs: [check, has-key]
    if: needs.has-key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install vera
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install-vera.sh 1.4.1 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fixture run (Vera + OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERA_HOME: ${{ runner.temp }}/.vera-revera
        run: fixtures/run-fixture.sh
