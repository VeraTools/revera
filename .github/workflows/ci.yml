name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package and Action versions
        run: ./scripts/check-versions.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Install vera
        run: |
          curl -fsSL https://github.com/VeraTools/Vera/releases/download/v1.4.1/vera-x86_64-unknown-linux-gnu.tar.gz -o /tmp/vera.tar.gz
          echo "42123fea81972e10afff70eea934d829000e956a946f8b2f59c22a78bbfea406  /tmp/vera.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf /tmp/vera.tar.gz -C /tmp
          install -m755 "$(find /tmp -name vera -type f | head -1)" "$RUNNER_TEMP/bin/vera"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: fixture run (needs Vera + OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERA_HOME: ${{ runner.temp }}/.vera-revera
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "skip: OPENROUTER_API_KEY secret not available"
            exit 0
          fi
          fixtures/run-fixture.sh
