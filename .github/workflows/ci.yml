name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Offline: everything here runs without provider credentials or network
  # access beyond the toolchain, on every push and on fork PRs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check package and Action versions
        run: ./scripts/check-versions.sh
      - name: Public docs hygiene
        run: ./scripts/check-docs-hygiene.sh
      - name: Installer tests (revera, vera)
        run: |
          bash scripts/test-install-revera.sh
          bash scripts/test-install-vera.sh
      - name: Action outcome normalisation test
        run: bash scripts/test-action-outcome.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # tests/vera_integration.rs drives the pinned vera binary against mock
      # embedding/reranker servers; REVERA_TEST_VERA makes it mandatory here.
      - name: Install vera (offline integration tests)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install-vera.sh 1.4.1 "$RUNNER_TEMP/bin"
          echo "REVERA_TEST_VERA=$RUNNER_TEMP/bin/vera" >> "$GITHUB_ENV"
      - run: cargo test
      - name: Offline evaluation harness tests
        run: |
          bash eval/test-run-all.sh
          bash eval/test-frozen.sh
      - name: doctor fails without publication credentials
        env:
          FIXTURE_SCRIPTS: ${{ github.workspace }}/fixtures/scripts
        run: |
          set -euo pipefail
          cfg=$RUNNER_TEMP/doctor.yaml
          sed 's/publish: dry-run/publish: comment/' fixtures/action/scripted-clean.yaml > "$cfg"
          echo '  token_env: REVERA_CI_MISSING_TOKEN' >> "$cfg"
          if env -u REVERA_CI_MISSING_TOKEN cargo run -q -- doctor --config "$cfg"; then
            echo "doctor must fail when the publish token is missing" >&2; exit 1
          fi
          REVERA_CI_MISSING_TOKEN=placeholder cargo run -q -- doctor --config "$cfg"

  # Same static build as release.yml, so a dependency that breaks the musl
  # target (e.g. a C-backed crypto provider) fails here, not at release time.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Static binary runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/revera
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" --version
      # build first: cargo itself must be able to download crates, so only
      # the test run sees the empty CA bundle. Empty (not missing) paths,
      # since cargo swaps missing ones for the probed system bundle.
      - name: HTTPS works without a system CA bundle
        run: |
          test=(cargo test --release --locked --target x86_64-unknown-linux-musl --test tls_roots)
          "${test[@]}" --no-run
          mkdir -p "$RUNNER_TEMP/no-ca"
          : > "$RUNNER_TEMP/no-ca.pem"
          SSL_CERT_FILE="$RUNNER_TEMP/no-ca.pem" SSL_CERT_DIR="$RUNNER_TEMP/no-ca" \
            "${test[@]}" --offline -- --ignored

  # Live: scripted models but a real Vera index built through a hosted endpoint
  # embeddings. Shown as *skipped* (not passed) when the secret is absent,
  # e.g. on fork PRs. The offline composite-Action proof is action-smoke.yml.
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
        run: |
          if [ -n "$REVERA_EMBEDDING_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live fixtures skipped::REVERA_EMBEDDING_API_KEY is not available to this run (expected for fork PRs); the live-fixtures job is skipped, not passed."
          fi

  live-fixtures:
    needs: [check, has-key]
    if: needs.has-key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install vera
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install-vera.sh 1.4.1 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fixture run (Vera + a hosted endpoint)
        env:
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          VERA_HOME: ${{ runner.temp }}/.vera-revera
        run: fixtures/run-fixture.sh
