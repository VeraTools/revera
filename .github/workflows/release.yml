name: release

# Runs for release tags only. A stable vX.Y.Z tag publishes a non-latest
# release; vX.Y.Z-<pre> publishes a pre-release. Major-tag and latest-release
# promotion are deliberate, separately dispatched operations in
# release-promote.yml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Upload dashboard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: web/build/
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: web
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag against Cargo.toml
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$tag is not a vX.Y.Z or vX.Y.Z-<pre> tag"; exit 1
          fi
          version=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"; exit 1
          fi
          scripts/check-versions.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install musl toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - name: Download dashboard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build/

      - name: Require dashboard before embedding
        run: |
          test -f web/build/index.html \
            || { echo "::error::dashboard build is missing web/build/index.html"; exit 1; }

      # static musl binary runs on older glibc hosts (e.g. Ubuntu 22.04)
      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          pkg="revera-$TARGET.tar.gz"
          tar -czf "$pkg" -C "target/$TARGET/release" revera
          sha256sum "$pkg" > "$pkg.sha256"

      - name: Verify packaged artifact
        env:
          REVERA_DOWNLOAD_BASE: file://${{ github.workspace }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p "$RUNNER_TEMP/revera-bin"
          ./scripts/install-revera.sh "$version" "$RUNNER_TEMP/revera-bin"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revera-${{ matrix.target }}
          path: |
            revera-${{ matrix.target }}.tar.gz
            revera-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: revera-*
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '$0 == tag {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          cat >> notes.md <<'NOTES'

          ### Install

          - GitHub App server: `ghcr.io/veratools/revera` (amd64 and arm64), see [docs/server.md](https://github.com/VeraTools/revera/blob/main/docs/server.md).
          - GitHub Action: `uses: VeraTools/revera@v0`.
          - Binaries: static Linux builds for x86_64 and aarch64 below. Check them with `sha256sum -c <file>.sha256`, or install with `scripts/install-revera.sh <X.Y.Z> <dir>`.
          NOTES

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Revera ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: false
          body_path: notes.md
          files: |
            revera-x86_64-unknown-linux-musl.tar.gz
            revera-x86_64-unknown-linux-musl.tar.gz.sha256
            revera-aarch64-unknown-linux-musl.tar.gz
            revera-aarch64-unknown-linux-musl.tar.gz.sha256

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: revera-*
          merge-multiple: true

      - name: Image version
        id: image
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/veratools/revera:${{ steps.image.outputs.version }}
