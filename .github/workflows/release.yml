name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          pkg=revera-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$pkg" -C target/release revera
          sha256sum "$pkg" > "$pkg.sha256"

      - name: Verify packaged artifact
        env:
          REVERA_DOWNLOAD_BASE: file://${{ github.workspace }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p "$RUNNER_TEMP/revera-bin"
          ./scripts/install-revera.sh "$version" "$RUNNER_TEMP/revera-bin"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            revera-x86_64-unknown-linux-gnu.tar.gz
            revera-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Move major tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable vX.Y.Z tag; skipping major tag move"
            exit 0
          fi
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"
