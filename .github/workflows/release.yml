name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          pkg=revera-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$pkg" -C target/release revera
          sha256sum "$pkg" > "$pkg.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            revera-x86_64-unknown-linux-gnu.tar.gz
            revera-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Move major tag v1
        if: startsWith(github.ref_name, 'v1.')
        run: |
          git tag -f v1 "${{ github.sha }}"
          git push -f origin v1
