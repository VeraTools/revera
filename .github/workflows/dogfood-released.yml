name: dogfood-released

# Reviews PRs with the *published* Action (@v0 -> musl release asset) instead
# of a source build; self-review.yml covers the source build (dry-run).
on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_FAST_API_KEY: ${{ secrets.RELAY_FAST_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ -n "$RELAY_FAST_API_KEY" ] && [ -n "$OPENCODE_GO_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: rv
        uses: VeraTools/revera@v0
        with:
          config: revera.yaml
          publish: ${{ matrix.os == 'ubuntu-latest' && 'comment' || 'dry-run' }}
          fail-on: failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_FAST_API_KEY: ${{ secrets.RELAY_FAST_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      - name: Action outputs
        run: |
          echo "status=${{ steps.rv.outputs.status }}"
          echo "findings=${{ steps.rv.outputs.findings }}"
      # musl asset should report "statically linked" on both runners
      - name: Installed binary sanity
        run: |
          revera --version
          file "$(command -v revera)" || true
