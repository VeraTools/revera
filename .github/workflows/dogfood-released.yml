name: dogfood-released

# Reviews PRs with the *published* Action (@v0 -> musl release asset) instead
# of a source build; self-review.yml covers the source build (dry-run).
on:
  pull_request:

permissions:
  contents: read

# One publisher per PR: a new push cancels the in-flight review so two runs
# never race to post inline comments / the managed summary.
concurrency:
  group: dogfood-released-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
        run: |
          missing=()
          [ -n "$REVERA_EMBEDDING_BASE_URL" ] || missing+=(REVERA_EMBEDDING_BASE_URL)
          [ -n "$REVERA_EMBEDDING_API_KEY" ] || missing+=(REVERA_EMBEDDING_API_KEY)
          [ -n "$REVERA_MODEL_BASE_URL" ] || missing+=(REVERA_MODEL_BASE_URL)
          [ -n "$REVERA_MODEL_API_KEY" ] || missing+=(REVERA_MODEL_API_KEY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live review skipped::secrets not available to this run: ${missing[*]} (expected for fork PRs). This is a SKIP, not a passing review; offline proof is action-smoke.yml."
          fi

  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: rv
        # Deliberately the moving major tag: this job tests what users of @v0 get.
        uses: VeraTools/revera@v0 # zizmor: ignore[unpinned-uses]
        with:
          config: .github/revera-self-review.yaml
          publish: ${{ matrix.os == 'ubuntu-latest' && 'comment' || 'dry-run' }}
          fail-on: failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
      - name: Action outputs
        env:
          STATUS: ${{ steps.rv.outputs.status }}
          FINDINGS: ${{ steps.rv.outputs.findings }}
          REPORT: ${{ steps.rv.outputs.report-path }}
        run: |
          released=$(git ls-remote https://github.com/VeraTools/revera.git 'refs/tags/v0^{}' 'refs/tags/v0' | head -n1 | cut -f1)
          {
            echo "- released action \`v0\` -> \`$released\` (this job does not test the PR's source)"
            echo "- status=$STATUS findings=$FINDINGS"
            if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
              jq -r '"- validation=\(.stats.validation) retrieval=\(.stats.retrieval) reused=\(.stats.reused) publication=\(.publication.mode) review_id=\(.publication.review_id // "-") skipped=\(.publication.skipped_reason // "-")"' "$REPORT"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # musl asset should report "statically linked" on both runners
      - name: Installed binary sanity
        run: |
          revera --version
          file "$(command -v revera)" || true
