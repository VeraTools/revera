name: self-review

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_FAST_API_KEY: ${{ secrets.RELAY_FAST_API_KEY }}
        run: |
          missing=()
          [ -n "$OPENROUTER_API_KEY" ] || missing+=(OPENROUTER_API_KEY)
          [ -n "$RELAY_FAST_API_KEY" ] || missing+=(RELAY_FAST_API_KEY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live self-review skipped::secrets not available to this run: ${missing[*]} (expected for fork PRs). This is a SKIP, not a passing review; offline proof is action-smoke.yml."
          fi

  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install vera
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install-vera.sh 1.4.1 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and review with the PR's own revera
        run: |
          cargo build --release --locked
          # source build stays dry-run; dogfood-released.yml owns the PR comment
          target/release/revera review --event "$GITHUB_EVENT_PATH" --config .github/revera-self-review.yaml --publish dry-run --out .revera/report.json || [ $? -eq 2 ]
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_FAST_API_KEY: ${{ secrets.RELAY_FAST_API_KEY }}
