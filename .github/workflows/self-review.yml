name: self-review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
          REVERA_FALLBACK_BASE_URL: ${{ secrets.REVERA_FALLBACK_BASE_URL }}
          REVERA_FALLBACK_API_KEY: ${{ secrets.REVERA_FALLBACK_API_KEY }}
        run: |
          missing=()
          [ -n "$REVERA_EMBEDDING_BASE_URL" ] || missing+=(REVERA_EMBEDDING_BASE_URL)
          [ -n "$REVERA_EMBEDDING_API_KEY" ] || missing+=(REVERA_EMBEDDING_API_KEY)
          [ -n "$REVERA_MODEL_BASE_URL" ] || missing+=(REVERA_MODEL_BASE_URL)
          [ -n "$REVERA_MODEL_API_KEY" ] || missing+=(REVERA_MODEL_API_KEY)
          [ -n "$REVERA_FALLBACK_BASE_URL" ] || missing+=(REVERA_FALLBACK_BASE_URL)
          [ -n "$REVERA_FALLBACK_API_KEY" ] || missing+=(REVERA_FALLBACK_API_KEY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live self-review skipped::secrets not available to this run: ${missing[*]} (expected for fork PRs). This is a SKIP, not a passing review; offline proof is action-smoke.yml."
          fi

  # Builds the checkout's source and runs the Action: review same-repository PRs,
  # warm the main index on push (fork PRs never receive secrets anyway).
  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # staged outside the checkout so the Action does not index it
      - name: Build revera and stage the local release for the Action's installer
        run: |
          set -euo pipefail
          cargo build --release --locked
          ver=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$ver" >> "$GITHUB_ENV"
          rel=$RUNNER_TEMP/revera-release; mkdir -p "$rel/pkg"
          cp target/release/revera "$rel/pkg/revera"
          tar -czf "$rel/revera-x86_64-unknown-linux-musl.tar.gz" -C "$rel/pkg" revera
          (cd "$rel" && sha256sum revera-x86_64-unknown-linux-musl.tar.gz > revera-x86_64-unknown-linux-musl.tar.gz.sha256)
      # Source build stays dry-run; dogfood-released.yml owns the PR comment.
      # Vera uses the Action's real default release, not a local override.
      - name: Review PR or warm main with the checkout's own revera
        uses: ./
        with:
          revera-version: ${{ env.version }}
          config: .github/revera-self-review.yaml
          publish: dry-run
          fail-on: failed
        env:
          REVERA_DOWNLOAD_BASE: file://${{ runner.temp }}/revera-release
          GITHUB_TOKEN: ${{ github.token }}
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
          REVERA_FALLBACK_BASE_URL: ${{ secrets.REVERA_FALLBACK_BASE_URL }}
          REVERA_FALLBACK_API_KEY: ${{ secrets.REVERA_FALLBACK_API_KEY }}
