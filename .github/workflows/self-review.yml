name: self-review

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          K: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install vera
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/VeraTools/Vera/releases/download/v1.4.1/vera-x86_64-unknown-linux-gnu.tar.gz -o /tmp/vera.tar.gz
          echo "42123fea81972e10afff70eea934d829000e956a946f8b2f59c22a78bbfea406  /tmp/vera.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf /tmp/vera.tar.gz -C /tmp
          install -m755 "$(find /tmp -name vera -type f | head -1)" "$RUNNER_TEMP/bin/vera"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and review with the PR's own revera
        run: |
          cargo build --release --locked
          target/release/revera review --event "$GITHUB_EVENT_PATH" --config revera.yaml --publish comment --out .revera/report.json || [ $? -eq 2 ]
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
