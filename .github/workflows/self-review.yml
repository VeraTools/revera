name: self-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  has-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        shell: bash
        env:
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
        run: |
          missing=()
          [ -n "$REVERA_EMBEDDING_BASE_URL" ] || missing+=(REVERA_EMBEDDING_BASE_URL)
          [ -n "$REVERA_EMBEDDING_API_KEY" ] || missing+=(REVERA_EMBEDDING_API_KEY)
          [ -n "$REVERA_MODEL_BASE_URL" ] || missing+=(REVERA_MODEL_BASE_URL)
          [ -n "$REVERA_MODEL_API_KEY" ] || missing+=(REVERA_MODEL_API_KEY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live self-review skipped::secrets not available to this run: ${missing[*]} (expected for fork PRs). This is a SKIP, not a passing review; offline proof is action-smoke.yml."
          fi

  # Builds and runs the PR's own source with hosted model credentials, so only for
  # same-repository branches (fork PRs never receive secrets anyway).
  revera:
    needs: has-key
    if: needs.has-key.outputs.ok == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install vera
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install-vera.sh 2.0.1 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and review with the PR's own revera
        run: |
          cargo build --release --locked
          # source build stays dry-run; dogfood-released.yml owns the PR comment
          target/release/revera review --event "$GITHUB_EVENT_PATH" --config .github/revera-self-review.yaml --publish dry-run --out .revera/report.json || [ $? -eq 2 ]
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVERA_EMBEDDING_BASE_URL: ${{ secrets.REVERA_EMBEDDING_BASE_URL }}
          REVERA_EMBEDDING_API_KEY: ${{ secrets.REVERA_EMBEDDING_API_KEY }}
          REVERA_MODEL_BASE_URL: ${{ secrets.REVERA_MODEL_BASE_URL }}
          REVERA_MODEL_API_KEY: ${{ secrets.REVERA_MODEL_API_KEY }}
