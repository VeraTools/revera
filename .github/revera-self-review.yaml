# Internal: the configuration this repository uses to review its own pull
# requests (self-review.yml builds from source; dogfood-released.yml runs the
# published Action). It is not a template; start from revera.example.yaml.
review:
  publish: comment
  # Release PRs are large; omitted files make the review partial.
  max_diff_bytes: 400000
models:
  investigator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3
    max_output_tokens: 16000
    temperature: 0.2
    reasoning: high
    fallback:
      - protocol: openai-chat
        base_url: ${REVERA_FALLBACK_BASE_URL}
        api_key_env: REVERA_FALLBACK_API_KEY
        model: factory/glm-5.3
        max_output_tokens: 16000
        temperature: 0.2
        reasoning: high
  validator:
    protocol: openai-chat
    base_url: ${REVERA_MODEL_BASE_URL}
    api_key_env: REVERA_MODEL_API_KEY
    model: glm-5.3-flash
    max_output_tokens: 4000
    temperature: 0.2
    reasoning: high
    fallback:
      - protocol: openai-chat
        base_url: ${REVERA_FALLBACK_BASE_URL}
        api_key_env: REVERA_FALLBACK_API_KEY
        model: factory/glm-5.3-flash
        max_output_tokens: 4000
        temperature: 0.2
        reasoning: high
vera:
  version: "2.4.1"
  backend: api
  embedding:
    base_url: ${REVERA_EMBEDDING_BASE_URL}
    model: qwen/qwen3-embedding-8b
    api_key_env: REVERA_EMBEDDING_API_KEY
  reranker:
    base_url: ${REVERA_RERANKER_BASE_URL}
    model: Qwen/Qwen3-Reranker-8B
    api_key_env: REVERA_RERANKER_API_KEY
budget:
  agent_max_tool_calls: 80
  agent_max_seconds: 900
  run_max_seconds: 1800
  run_max_requests: 250
