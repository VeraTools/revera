# Internal: the configuration this repository uses to review its own pull
# requests (self-review.yml builds from source; dogfood-released.yml runs the
# published Action). It is not a template; start from revera.example.yaml.
review:
  publish: comment
models:
  investigator:
    protocol: openai-chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: meta/muse-spark-1.3-contributor
    max_output_tokens: 6000
    temperature: 0.2
    reasoning: high
  validator:
    protocol: openai-chat
    base_url: https://relay.fast/v1
    api_key_env: RELAY_FAST_API_KEY
    model: glm-5.3-flash
    max_output_tokens: 4000
    temperature: 0.2
    reasoning: high
vera:
  version: "1.4.1"
  backend: api
  embedding:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-embedding-8b
    api_key_env: OPENROUTER_API_KEY
  reranker:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-reranker-8b
    api_key_env: OPENROUTER_API_KEY
